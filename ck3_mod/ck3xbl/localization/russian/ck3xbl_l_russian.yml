l_russian:
 # Фильтр сообщений (ключ = "message_filter_" + фильтр) и всплывающее сообщение о битве.
 message_filter_ck3xbl_battle:0 "Битвы на поле боя"
 msg_ck3xbl_battle_begins_title:0 "К оружию!"
 msg_ck3xbl_battle_begins_desc:0 "Армии сошлись. Выйдете ли вы на поле боя?"

 # Боевые часы (docs/PROTOCOL.md 14): сообщение о второй схватке и новости (фильтр ck3xbl_battle_news, без паузы).
 message_filter_ck3xbl_battle_news:0 "Битвы, решённые на поле боя"
 msg_ck3xbl_reinforcements_title:0 "Подкрепления!"
 msg_ck3xbl_reinforcements_desc:0 "К месту битвы подходят свежие войска. Выйдете ли вы на поле снова?"
 msg_ck3xbl_battle_rages_title:0 "Битва продолжается"
 msg_ck3xbl_battle_rages_desc:0 "Битва ещё не окончена. Снимите игру с паузы, чтобы увидеть её исход."
 msg_ck3xbl_battle_over_title:0 "Битва окончена"
 msg_ck3xbl_battle_over_desc:0 "Сражение стихло, и войска считают своих павших."

 # 0001 - призыв к оружию
 ck3xbl_battle.0001.t:0 "Битва: [ck3xbl_prov.GetNameNoTooltip]"
 ck3xbl_battle.0001.desc.attacking:0 "Наше войско настигло [ck3xbl_enemy_leader.GetTitledFirstName] в провинции [ck3xbl_prov.GetNameNoTooltip]. Поле боя за нами, если нам хватит духу."
 ck3xbl_battle.0001.desc.defending:0 "Знамёна [ck3xbl_enemy_leader.GetTitledFirstName] показались на холмах провинции [ck3xbl_prov.GetNameNoTooltip]. Нашему войску придётся принять бой."
 ck3xbl_battle.0001.desc.odds:0 "\n\n#V [ck3xbl_my_men|0]#! наших воинов против #V [ck3xbl_enemy_men|0]#!."
 ck3xbl_battle.0001.t.reinforcements:0 "Подходят подкрепления!"
 ck3xbl_battle.0001.desc.reinforcements_ours:0 "[ck3xbl_joiner_leader.GetTitledFirstName] прибывает в провинцию [ck3xbl_prov.GetNameNoTooltip] со свежими войсками для нашего войска. Исход битвы снова висит на волоске."
 ck3xbl_battle.0001.desc.reinforcements_theirs:0 "[ck3xbl_joiner_leader.GetTitledFirstName] прибывает в провинцию [ck3xbl_prov.GetNameNoTooltip] со свежими войсками для вражеского войска. Исход битвы снова висит на волоске."
 ck3xbl_battle.0001.desc.passed:0 "Момент упущен: битва продолжилась без вас."
 ck3xbl_moment_passed_tt:0 "Битва продолжилась без вас"
 ck3xbl_battle.0001.a:0 "Я сам выйду на поле боя!"
 ck3xbl_battle.0001.c:0 "Я лично поведу это войско."
 ck3xbl_battle.0001.b:0 "Пусть мои командиры решат исход дня."
 ck3xbl_battle.0001.d:0 "Прорвёмся в крепость и удержим стены!"
 ck3xbl_battle.0001.d.tt:0 "Бой в Bannerlord на стенах осаждённого владения вместе с гарнизоном. Прорыв стоит 10-20% войска, тем меньше, чем выше Военное дело вашего командира."
 ck3xbl_battle.0001.e:0 "Ударим по лагерю осаждающих!"
 ck3xbl_battle.0001.e.tt:0 "Бой в Bannerlord у стен: осаждающие застигнуты в лагере, а гарнизон делает вылазку вам на помощь."
 ck3xbl_field_busy_tt:0 "На поле боя уже идёт другая битва"
 ck3xbl_with_host_tt:0 "Вы находитесь при этом войске"
 ck3xbl_away_from_host_tt:0 "Вас нет при этом войске"

 # Поединок в Bannerlord (docs/PROTOCOL.md 18)
 msg_ck3xbl_duel_begins_title:0 "Поединок!"
 msg_ck3xbl_duel_begins_desc:0 "Брошен вызов. Сразитесь ли вы своей рукой?"
 ck3xbl_duel.0001.t:0 "Поединок"
 ck3xbl_duel.0001.desc:0 "[ck3xbl_enemy_leader.GetTitledFirstName] стоит наготове с оружием в руках. Вы можете сами выйти против этого бойца на поле в Bannerlord или положиться на судьбу."
 ck3xbl_duel.0001.desc.deadly:0 "\n\n#N Это бой насмерть.#!"
 ck3xbl_duel.0001.desc.risky:0 "\n\n#N Павший может уже не подняться.#!"
 ck3xbl_duel.0001.desc.practice:0 "\n\n#weak Учебный поединок: всерьёз кровь не прольётся.#!"
 ck3xbl_duel.0001.desc.blood:0 "\n\n#weak Ранения вероятны, а смерть решит обычай.#!"
 ck3xbl_duel.0001.a:0 "Я сражусь своей рукой!"
 ck3xbl_duel.0001.b:0 "Пусть решит судьба."
 ck3xbl_duel.0002.t:0 "Сталь против стали"
 ck3xbl_duel.0002.desc:0 "Бой идёт. Когда он закончится, исход станет известен здесь."
 ck3xbl_duel.0002.a:0 "Бой окончен..."
 ck3xbl_duel.0002.b:0 "Пусть всё же решит судьба."

 # Стычки в пути в Bannerlord (docs/PROTOCOL.md 20)
 ck3xbl_skirmish.fight:0 "К оружию! Принять бой в Bannerlord!"
 ck3xbl_tourney.fight:0 "Выйти на ристалище самому, в Bannerlord!"
 msg_ck3xbl_tourney_begins_title:0 "На ристалище!"
 msg_ck3xbl_tourney_begins_desc:0 "Герольды выкликают ваше имя. Схватка пройдёт в Bannerlord."
 ck3xbl_tourney.0002.t:0 "На ристалище"
 ck3xbl_tourney.0002.desc:0 "Толпа ревёт, схватка началась. Когда она закончится, исход станет известен здесь."
 ck3xbl_tourney.0002.a:0 "Схватка решена..."
 ck3xbl_tourney.0002.b:0 "Пусть всё же решают судьи."
 ck3xbl_skirmish.0002.t:0 "Клинки на дороге"
 ck3xbl_skirmish.0002.desc:0 "На дороге звенит сталь: [ck3xbl_foe.GetTitledFirstName] со [ck3xbl_foe.GetHerHis] шайкой напал на ваш отряд. Когда бой закончится, исход станет известен здесь."
 ck3xbl_skirmish.0002.a:0 "Бой окончен..."
 ck3xbl_skirmish.0002.b:0 "Уйти, пока можно."
 ck3xbl_skirmish.won:0 "Путь свободен"
 ck3xbl_skirmish.won.desc:0 "Ваш отряд отбился: [ck3xbl_foe.GetTitledFirstName] бежит, а [ck3xbl_foe.GetSheHe] бросил добычу."
 ck3xbl_skirmish.lost:0 "Разбиты в пути"
 ck3xbl_skirmish.lost.desc:0 "[ck3xbl_foe.GetTitledFirstName] одержал верх над вашим отрядом, и кошелёк ваш стал легче."

 # 0002 - ожидание исхода; строку состояния рисует gui/event_window_widgets/ck3xbl_keypad.gui
 ck3xbl_battle.0002.t:0 "Армии сходятся"
 ck3xbl_battle.0002.desc:0 "В провинции [ck3xbl_prov.GetNameNoTooltip] звенит сталь. Вести об исходе скоро дойдут до нас."
 ck3xbl_battle.0002.desc.clock:0 "\n\nКогда пыль осядет, снимите игру с паузы: битва решится в ближайшие дни."
 ck3xbl_battle.0002.a:0 "Пыль оседает..."
 ck3xbl_battle.0002.b:0 "Пусть битва идёт своим чередом без меня."
 ck3xbl_input_status:0 "[SelectLocalization( GreaterThan_CFixedPoint( GetPlayer.MakeScope.Var('ck3xbl_ready').GetValue, '(CFixedPoint)0' ), 'ck3xbl_input_status_ready', 'ck3xbl_input_status_wait' )]"
 ck3xbl_input_status_wait:0 "#weak Ждём вестей с поля боя...#!"
 ck3xbl_input_status_ready:0 "#P Гонец прибыл.#!"

 # 0003 - итог (переменные игрока задаёт ck3xbl_apply_summary_effect)
 ck3xbl_battle.0003.t.win:0 "Победа: [ck3xbl_prov.GetNameNoTooltip]"
 ck3xbl_battle.0003.t.loss:0 "Поражение: [ck3xbl_prov.GetNameNoTooltip]"
 ck3xbl_battle.0003.t.undecided:0 "Битва: [ck3xbl_prov.GetNameNoTooltip]"
 ck3xbl_battle.0003.desc.numbers:0 "Мы потеряли #N [ROOT.Char.MakeScope.Var('ck3xbl_res_my_lost').GetValue|0]#! воинов, а враг оставил на поле #P [ROOT.Char.MakeScope.Var('ck3xbl_res_enemy_lost').GetValue|0]#! своих."
 ck3xbl_battle.0003.desc.personal:0 "\n\nСвоей рукой я сразил #V [ROOT.Char.MakeScope.Var('ck3xbl_res_my_kills').GetValue|0]#! врагов."
 ck3xbl_battle.0003.desc.continues:0 "\n\nНи одно войско не дрогнуло: армии по-прежнему сцеплены в бою."
 ck3xbl_battle.0003.desc.aftermath:0 "\n\nБегство ещё не закончилось: побеждённых могут взять в плен или зарубить."
 ck3xbl_battle.0003.desc.cancelled:0 "С поля боя не пришло вестей. Мои командиры доведут битву до конца."
 ck3xbl_battle.0003.a:0 "Да будет так."

 # Строки итогов битвы (battle_event). CHARACTER = пострадавший (левый портрет), TARGET_CHARACTER = убийца или пленитель.
