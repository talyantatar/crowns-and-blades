 ck3xbl_maimed_friendly:0 "[CHARACTER.GetUINameNoTooltip] получает увечье в гуще боя!"
 ck3xbl_maimed_friendly_player:0 "Вы получили увечье в гуще боя!"
 ck3xbl_maimed_enemy:0 "Вражеский воин [CHARACTER.GetUINameNoTooltip] получает увечье в гуще боя!"
 ck3xbl_maimed_enemy_player:0 "Вражеский воин [CHARACTER.GetUINameNoTooltip] получает увечье в гуще боя!"
 ck3xbl_maimed_by_friendly:0 "[TARGET_CHARACTER.GetUINameNoTooltip] калечит [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_maimed_by_friendly_player:0 "Вас калечит [TARGET_CHARACTER.GetUINameNoTooltip]!"
