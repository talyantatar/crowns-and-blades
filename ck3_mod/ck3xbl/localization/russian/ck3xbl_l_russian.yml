 ck3xbl_slain_friendly:0 "[CHARACTER.GetUINameNoTooltip] гибнет в гуще боя!"
 ck3xbl_slain_friendly_player:0 "Вы пали в гуще боя!"
 ck3xbl_slain_enemy:0 "Вражеский воин [CHARACTER.GetUINameNoTooltip] гибнет в гуще боя!"
 ck3xbl_slain_enemy_player:0 "Вражеский воин [CHARACTER.GetUINameNoTooltip] гибнет в гуще боя!"
 ck3xbl_slain_by_friendly:0 "[TARGET_CHARACTER.GetUINameNoTooltip] убивает [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_slain_by_friendly_player:0 "Вас убивает [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_slain_by_enemy:0 "[TARGET_CHARACTER.GetUINameNoTooltip] сражает [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_slain_by_enemy_player:0 "Вы сразили [CHARACTER.GetUINameNoTooltip] в гуще боя!"
 ck3xbl_captured_friendly:0 "[TARGET_CHARACTER.GetUINameNoTooltip] берёт в плен [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_captured_friendly_player:0 "Вас берёт в плен [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_captured_enemy:0 "[TARGET_CHARACTER.GetUINameNoTooltip] берёт в плен [CHARACTER.GetUINameNoTooltip] после битвы!"
 ck3xbl_captured_enemy_player:0 "Вы взяли в плен [CHARACTER.GetUINameNoTooltip] после битвы!"

 # Подвиги в битвах (PROTOCOL 32).
 ck3xbl_trophy_toast:0 "Трофей с поля боя"

 ck3xbl_battle.0001.desc.carried:0 "\n\n#weak CK3 ещё засчитывает потери первой схватки, поэтому числа выше их пока не учитывают. В Bannerlord выйдут только те, кто её пережил.#!"

 ck3xbl_tourney_prize_toast:0 "Турнирный приз: снаряжение"

 # Осады (PROTOCOL 39).
 ck3xbl_storm_walls_decision:0 "Взять стены штурмом в Bannerlord"
 ck3xbl_storm_walls_decision_desc:0 "Хватит ждать, пока защитники ослабнут: ведите людей на стены. Чем дольше длится осада, тем больше осадных машин готово к штурму: лестницы, башни, таран, пролом в стене."
 ck3xbl_storm_walls_decision_tooltip:0 "Штурмовать осаждённую крепость в Bannerlord"
 ck3xbl_storm_walls_decision_effect_tt:0 "Штурм пройдёт в Bannerlord. Победа — крепость падёт в ближайшие дни. Поражение — осада продолжится, а ваши потери останутся."
 ck3xbl_siege.0002.t:0 "Штурм"
 ck3xbl_siege.0002.desc:0 "Лестницы приставлены, тараны подвезены. Штурм идёт в Bannerlord, и, когда он закончится, исход станет известен здесь."
 ck3xbl_siege.0002.a:0 "Штурм окончен..."
 ck3xbl_siege.0002.b:0 "Отменить штурм, осада продолжится как в CK3"
 ck3xbl_siege.won:0 "Стены взяты!"
 ck3xbl_siege.won.desc:0 "Защитники сломлены, крепость падёт в ближайшие дни."
 ck3xbl_siege.lost:0 "Штурм отбит"
 ck3xbl_siege.lost.desc:0 "Защитники удержали стены. Осада продолжается."
 ck3xbl_walls_stormed:0 "Стены взяты штурмом"
 ck3xbl_walls_stormed_desc:0 "Стены этой крепости взяты штурмом, гарнизон разбит. Пролом ещё не заделан."
 ck3xbl_sacked_modifier:0 "Разграблено"
 ck3xbl_sacked_modifier_desc:0 "Солдаты разграбили это графство после штурма. Жители этого не забыли."
 ck3xbl_ransomed_modifier:0 "Откуп"
 ck3xbl_ransomed_modifier_desc:0 "Горожане откупились от солдат, взявших их стены."
 ck3xbl_spared_modifier:0 "Пощажено"
 ck3xbl_spared_modifier_desc:0 "Завоеватель, взявший эти стены, пощадил город. Люди говорят о нём добрые слова."
 ck3xbl_siege.0010.t:0 "Крепость пала"
 ck3xbl_siege.0010.desc:0 "Над [county.GetName] развеваются знамёна [ROOT.Char.GetShortUIName]. Воины, взошедшие на стены, ждут слова своего господина: город лежит перед ними, и мне решать его судьбу."
 ck3xbl_siege.0010.a:0 "Пусть воины берут что хотят."
 ck3xbl_siege.0010.b:0 "Пусть горожане откупятся."
 ck3xbl_siege.0010.c:0 "Пощадить город. Мы пришли за стенами, а не за людьми."
 ck3xbl_storming_party:0 "Штурмовой отряд в крепости"
 ck3xbl_storming_party_desc:0 "Ваши люди уже на стенах: остатки обороны вот-вот рухнут."
 ck3xbl_sea_battle_decision:0 "Атаковать вражеский флот в Bannerlord"
 ck3xbl_sea_battle_decision_desc:0 "Вражеские паруса рядом. Подойти борт к борту и взять их на абордаж: бой пройдёт в Bannerlord, корабль против корабля."
 ck3xbl_sea_battle_decision_tooltip:0 "Атаковать ближайший вражеский флот в Bannerlord"
 ck3xbl_sea_battle_decision_effect_tt:0 "Враг может уйти: чем лучше военное дело его командира против вашего, тем вероятнее. Если догоним — бой в море в Bannerlord, и половина бежавших с проигравших кораблей утонет."
 ck3xbl_sea.0002.t:0 "Морской бой"
 ck3xbl_sea.0002.desc:0 "Летят абордажные крюки, палубы полны людей. Бой идёт в Bannerlord, и, когда он закончится, исход станет известен здесь."
 ck3xbl_sea.0002.a:0 "Бой окончен..."
 ck3xbl_sea.0002.b:0 "Отменить бой: флоты расходятся"
 ck3xbl_sea.0010.t:0 "Паруса на горизонте"
 ck3xbl_sea.0010.desc:0 "Дозорный кричит с мачты: показались корабли [ck3xbl_enemy_leader.Char.GetShortUIName]. Ветер на нашей стороне, если мы хотим их догнать."
 ck3xbl_sea.0010.a:0 "Идём на них!"
 ck3xbl_sea.0010.b:0 "Держать прежний курс."
 ck3xbl_sea.0011.t:0 "Враг идёт на сближение"
 ck3xbl_sea.0011.desc:0 "Корабли [ck3xbl_enemy_leader.Char.GetShortUIName] повернули к нам и быстро приближаются."
 ck3xbl_sea.0011.a:0 "К бою!"
 ck3xbl_sea.0011.b:0 "Поднять все паруса и уходить."
 ck3xbl_sea.0011.b.tt:0 "Уйти или нет — решает военное дело вашего командира против вражеского; если догонят, бой всё равно будет."
 ck3xbl_sea.escaped:0 "Враг ушёл"
 ck3xbl_sea.escaped.desc:0 "Вражеский флот оказался быстрее и скрылся."
 ck3xbl_sea.slipped:0 "Мы ушли"
 ck3xbl_sea.slipped.desc:0 "Вражеские корабли отстали: погони больше нет."
 ck3xbl_sea.caught:0 "Нас догнали"
 ck3xbl_sea.caught.desc:0 "Уйти не удалось: придётся драться."
 ck3xbl_sea.won:0 "Победа на море!"
 ck3xbl_sea.won.desc:0 "Вражеские корабли взяты или потоплены."
 ck3xbl_sea.lost:0 "Поражение на море"
 ck3xbl_sea.lost.desc:0 "Наши корабли разбиты, и многие из прыгнувших за борт так и не добрались до берега."
