l_english:
 # Message filter (key = "message_filter_" + filter) and the battle toast.
 message_filter_ck3xbl_battle:0 "Battles fought in the field"
 msg_ck3xbl_battle_begins_title:0 "To Arms!"
 msg_ck3xbl_battle_begins_desc:0 "The armies meet. Will you take the field?"

 # Battle clock (docs/PROTOCOL.md 14): the second-clash toast and the news toasts (filter ck3xbl_battle_news, no pause).
 message_filter_ck3xbl_battle_news:0 "Battles decided in the field"
 msg_ck3xbl_reinforcements_title:0 "Reinforcements!"
 msg_ck3xbl_reinforcements_desc:0 "Fresh troops reach the battle. Will you take the field again?"
 msg_ck3xbl_battle_rages_title:0 "The Battle Rages On"
 msg_ck3xbl_battle_rages_desc:0 "The battle is not over yet. Resume the game to see it decided."
 msg_ck3xbl_battle_over_title:0 "The Battle Is Over"
 msg_ck3xbl_battle_over_desc:0 "The fighting has ended and the hosts count their dead."

 # 0001 - the call to arms
 ck3xbl_battle.0001.t:0 "The Battle of [ck3xbl_prov.GetNameNoTooltip]"
 ck3xbl_battle.0001.desc.attacking:0 "Our host has run down [ck3xbl_enemy_leader.GetTitledFirstName] near [ck3xbl_prov.GetNameNoTooltip]. The field is ours to take, if we have the stomach for it."
 ck3xbl_battle.0001.desc.defending:0 "The banners of [ck3xbl_enemy_leader.GetTitledFirstName] crest the hills above [ck3xbl_prov.GetNameNoTooltip]. Our host must stand and fight."
 # The troop numbers are saved scope values of this event's chain (one per battle, so two windows never mix them).
 ck3xbl_battle.0001.desc.odds:0 "\n\n#V [ck3xbl_my_men|0]#! of our men stand against #V [ck3xbl_enemy_men|0]#!."
 # A second clash (PROTOCOL 14.6): the joiner reinforces our host or the enemy's; "passed" once the battle went on without us.
 ck3xbl_battle.0001.t.reinforcements:0 "Reinforcements Arrive!"
 ck3xbl_battle.0001.desc.reinforcements_ours:0 "[ck3xbl_joiner_leader.GetTitledFirstName] arrives at [ck3xbl_prov.GetNameNoTooltip] with fresh troops for our host. The battle hangs in the balance again."
 ck3xbl_battle.0001.desc.reinforcements_theirs:0 "[ck3xbl_joiner_leader.GetTitledFirstName] arrives at [ck3xbl_prov.GetNameNoTooltip] with fresh troops for the enemy host. The battle hangs in the balance again."
 ck3xbl_battle.0001.desc.passed:0 "The moment has passed: the battle went on without you."
 ck3xbl_moment_passed_tt:0 "The battle went on without you"
 ck3xbl_battle.0001.a:0 "I will take the field myself!"
 ck3xbl_battle.0001.c:0 "I will lead this host in person."
 ck3xbl_battle.0001.b:0 "Let my commanders decide the day."
 ck3xbl_battle.0001.d:0 "We break into the holding and hold the walls!"
 ck3xbl_battle.0001.d.tt:0 "Fight in Bannerlord on the walls of the besieged holding, with its garrison. Breaking in costs 10-20% of your host, the less the higher your commander's Martial."
 ck3xbl_battle.0001.e:0 "We fall on the besiegers' camp!"
 ck3xbl_battle.0001.e.tt:0 "Fight in Bannerlord before the walls: the besiegers are caught in their camp, and the garrison sallies out to join you."
 ck3xbl_field_busy_tt:0 "Another battle is already being fought in the field"
 ck3xbl_with_host_tt:0 "You ride with this host"
 ck3xbl_away_from_host_tt:0 "You are not with this host"

 # Single combat in Bannerlord (docs/PROTOCOL.md 18)
 msg_ck3xbl_duel_begins_title:0 "Single Combat!"
 msg_ck3xbl_duel_begins_desc:0 "A challenge has been made. Will you fight it with your own hand?"
 ck3xbl_duel.0001.t:0 "Single Combat"
 ck3xbl_duel.0001.desc:0 "[ck3xbl_enemy_leader.GetTitledFirstName] stands ready, steel in hand. You can face this foe yourself on the field in Bannerlord, or let fate decide the fight."
 ck3xbl_duel.0001.desc.deadly:0 "\n\n#N This fight is to the death.#!"
 ck3xbl_duel.0001.desc.risky:0 "\n\n#N Whoever falls may not rise again.#!"
 ck3xbl_duel.0001.desc.practice:0 "\n\n#weak A practice bout: no blood will be shed in earnest.#!"
 ck3xbl_duel.0001.desc.blood:0 "\n\n#weak Wounds are likely; death is in the hands of custom.#!"
 ck3xbl_duel.0001.a:0 "I will fight with my own hand!"
 ck3xbl_duel.0001.b:0 "Let fate decide."
 ck3xbl_duel.0002.t:0 "Steel Against Steel"
 ck3xbl_duel.0002.desc:0 "The fight is on. When it is over, the outcome will be told here."
 ck3xbl_duel.0002.a:0 "The fight is decided..."
 ck3xbl_duel.0002.b:0 "Let fate decide after all."

 # Skirmishes on the road in Bannerlord (docs/PROTOCOL.md 20)
 ck3xbl_skirmish.fight:0 "Draw steel and fight it out in Bannerlord!"
 ck3xbl_tourney.fight:0 "Step into the lists yourself, in Bannerlord!"
 msg_ck3xbl_tourney_begins_title:0 "To the Lists!"
 msg_ck3xbl_tourney_begins_desc:0 "The heralds call your name. The bout is fought in Bannerlord."
 ck3xbl_tourney.0002.t:0 "In the Lists"
 ck3xbl_tourney.0002.desc:0 "The crowd roars as the bout begins. When it is over, the outcome will be told here."
 ck3xbl_tourney.0002.a:0 "The bout is decided..."
 ck3xbl_tourney.0002.b:0 "Let the judges decide after all."
 ck3xbl_skirmish.0002.t:0 "Blades on the Road"
 ck3xbl_skirmish.0002.desc:0 "Steel rings out on the road as [ck3xbl_foe.GetTitledFirstName] and [ck3xbl_foe.GetHerHis] band fall upon your company. When the fight is over, the outcome will be told here."
 ck3xbl_skirmish.0002.a:0 "The fight is over..."
 ck3xbl_skirmish.0002.b:0 "Slip away while we can."
 ck3xbl_skirmish.won:0 "The Road Is Clear"
 ck3xbl_skirmish.won.desc:0 "Your company drove off [ck3xbl_foe.GetTitledFirstName] and took what [ck3xbl_foe.GetSheHe] left behind."
 ck3xbl_skirmish.lost:0 "Beaten on the Road"
 ck3xbl_skirmish.lost.desc:0 "[ck3xbl_foe.GetTitledFirstName] got the better of your company, and your purse is lighter for it."

 # 0002 - waiting for the battle; the status line is drawn by gui/event_window_widgets/ck3xbl_keypad.gui
 ck3xbl_battle.0002.t:0 "The Armies Clash"
 ck3xbl_battle.0002.desc:0 "Steel rings out across [ck3xbl_prov.GetNameNoTooltip]. Word of the outcome will reach us soon."
 ck3xbl_battle.0002.desc.clock:0 "\n\nWhen the dust settles, resume the game: the battle will be decided within days."
 ck3xbl_battle.0002.a:0 "The dust settles..."
 ck3xbl_battle.0002.b:0 "Let the battle run its course without me."
 ck3xbl_input_status:0 "[SelectLocalization( GreaterThan_CFixedPoint( GetPlayer.MakeScope.Var('ck3xbl_ready').GetValue, '(CFixedPoint)0' ), 'ck3xbl_input_status_ready', 'ck3xbl_input_status_wait' )]"
 ck3xbl_input_status_wait:0 "#weak Awaiting word from the field...#!"
 ck3xbl_input_status_ready:0 "#P The dispatch has arrived.#!"

 # 0003 - the outcome (player variables set by ck3xbl_apply_summary_effect)
 ck3xbl_battle.0003.t.win:0 "Victory at [ck3xbl_prov.GetNameNoTooltip]"
 ck3xbl_battle.0003.t.loss:0 "Defeat at [ck3xbl_prov.GetNameNoTooltip]"
 ck3xbl_battle.0003.t.undecided:0 "The Battle of [ck3xbl_prov.GetNameNoTooltip]"
 ck3xbl_battle.0003.desc.numbers:0 "We lost #N [ROOT.Char.MakeScope.Var('ck3xbl_res_my_lost').GetValue|0]#! men, and the enemy left #P [ROOT.Char.MakeScope.Var('ck3xbl_res_enemy_lost').GetValue|0]#! of theirs on the field."
 ck3xbl_battle.0003.desc.personal:0 "\n\nI cut down #V [ROOT.Char.MakeScope.Var('ck3xbl_res_my_kills').GetValue|0]#! foes with my own hand."
 ck3xbl_battle.0003.desc.continues:0 "\n\nNeither host has broken: the armies remain locked in battle."
 ck3xbl_battle.0003.desc.aftermath:0 "\n\nThe rout is not over: more of the vanquished may yet be taken or cut down."
 ck3xbl_battle.0003.desc.cancelled:0 "No word came from the field. My commanders will see the battle through."
 ck3xbl_battle.0003.a:0 "So it is written."

 # Combat summary lines (battle_event). Attached to the victim's side: CHARACTER = the victim (left portrait),
 # TARGET_CHARACTER = the killer or captor (right portrait). The engine appends _friendly / _enemy and the
 # _player variants when the player is the character of that perspective.
 ck3xbl_wounded_friendly:0 "[CHARACTER.GetUINameNoTooltip] was wounded in the thick of the fighting!"
 ck3xbl_wounded_friendly_player:0 "You were wounded in the thick of the fighting!"
 ck3xbl_wounded_enemy:0 "The enemy's [CHARACTER.GetUINameNoTooltip] was wounded in the thick of the fighting!"
 ck3xbl_wounded_enemy_player:0 "The enemy's [CHARACTER.GetUINameNoTooltip] was wounded in the thick of the fighting!"
 ck3xbl_wounded_by_friendly:0 "[CHARACTER.GetUINameNoTooltip] was wounded by [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_wounded_by_friendly_player:0 "You were wounded by [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_wounded_by_enemy:0 "[TARGET_CHARACTER.GetUINameNoTooltip] wounded [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_wounded_by_enemy_player:0 "You wounded [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_maimed_friendly:0 "[CHARACTER.GetUINameNoTooltip] was maimed in the thick of the fighting!"
 ck3xbl_maimed_friendly_player:0 "You were maimed in the thick of the fighting!"
 ck3xbl_maimed_enemy:0 "The enemy's [CHARACTER.GetUINameNoTooltip] was maimed in the thick of the fighting!"
 ck3xbl_maimed_enemy_player:0 "The enemy's [CHARACTER.GetUINameNoTooltip] was maimed in the thick of the fighting!"
 ck3xbl_maimed_by_friendly:0 "[CHARACTER.GetUINameNoTooltip] was maimed by [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_maimed_by_friendly_player:0 "You were maimed by [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_maimed_by_enemy:0 "[TARGET_CHARACTER.GetUINameNoTooltip] maimed [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_maimed_by_enemy_player:0 "You maimed [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_slain_friendly:0 "[CHARACTER.GetUINameNoTooltip] was slain in the thick of the fighting!"
 ck3xbl_slain_friendly_player:0 "You were slain in the thick of the fighting!"
 ck3xbl_slain_enemy:0 "The enemy's [CHARACTER.GetUINameNoTooltip] was slain in the thick of the fighting!"
 ck3xbl_slain_enemy_player:0 "The enemy's [CHARACTER.GetUINameNoTooltip] was slain in the thick of the fighting!"
 ck3xbl_slain_by_friendly:0 "[CHARACTER.GetUINameNoTooltip] was slain by [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_slain_by_friendly_player:0 "You were slain by [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_slain_by_enemy:0 "[TARGET_CHARACTER.GetUINameNoTooltip] cut down [CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_slain_by_enemy_player:0 "You cut down [CHARACTER.GetUINameNoTooltip] in the thick of the fighting!"
 ck3xbl_captured_friendly:0 "[CHARACTER.GetUINameNoTooltip] was captured by [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_captured_friendly_player:0 "You were captured by [TARGET_CHARACTER.GetUINameNoTooltip]!"
 ck3xbl_captured_enemy:0 "[TARGET_CHARACTER.GetUINameNoTooltip] captured [CHARACTER.GetUINameNoTooltip] after the battle!"
 ck3xbl_captured_enemy_player:0 "You captured [CHARACTER.GetUINameNoTooltip] after the battle!"

 # Battle feats (PROTOCOL 32).
 ck3xbl_trophy_toast:0 "A trophy from the field"

 ck3xbl_battle.0001.desc.carried:0 "\n\n#weak CK3 is still counting the first clash's losses, so the numbers above do not show them yet. Only those who lived through it take the field in Bannerlord.#!"

 ck3xbl_tourney_prize_toast:0 "Tournament prize: battle gear"

 # Sieges (PROTOCOL 39).
 ck3xbl_storm_walls_decision:0 "Storm the Walls in Bannerlord"
 ck3xbl_storm_walls_decision_desc:0 "No more waiting for the defenders to weaken: lead the men onto the walls. The longer the siege has run, the more siege works stand ready: ladders, towers, a ram, a breach."
 ck3xbl_storm_walls_decision_tooltip:0 "Storm the besieged holding in Bannerlord"
 ck3xbl_storm_walls_decision_effect_tt:0 "The assault is fought in Bannerlord. A victory makes the holding fall within days; a defeat leaves the siege running and your losses counted."
 ck3xbl_siege.0002.t:0 "The Assault"
 ck3xbl_siege.0002.desc:0 "The ladders are up, the rams rolled forward. The assault is fought in Bannerlord; when it is over, its outcome will be known here."
 ck3xbl_siege.0002.a:0 "The assault is over..."
 ck3xbl_siege.0002.b:0 "Call off the assault; the siege goes on as CK3's"
 ck3xbl_siege.won:0 "The Walls Are Taken!"
 ck3xbl_siege.won.desc:0 "The defenders are broken; the holding will fall within days."
 ck3xbl_siege.lost:0 "The Assault Is Thrown Back"
 ck3xbl_siege.lost.desc:0 "The defenders held the walls. The siege goes on."
 ck3xbl_walls_stormed:0 "Walls Stormed"
 ck3xbl_walls_stormed_desc:0 "This holding's walls were stormed and its garrison broken. The breach is not yet repaired."
 ck3xbl_sacked_modifier:0 "Sacked"
 ck3xbl_sacked_modifier_desc:0 "Soldiers sacked this county after storming its walls. Its people have not forgotten."
 ck3xbl_ransomed_modifier:0 "Ransomed"
 ck3xbl_ransomed_modifier_desc:0 "The townsfolk bought their safety from the soldiers who stormed their walls."
 ck3xbl_spared_modifier:0 "Spared"
 ck3xbl_spared_modifier_desc:0 "The conqueror who stormed these walls spared the town. The people speak well of it."
 ck3xbl_siege.0010.t:0 "The Holding Has Fallen"
 ck3xbl_siege.0010.desc:0 "The banners of [ROOT.Char.GetShortUIName] fly over [county.GetName]. The men who climbed the walls look to their lord: the town lies open before them, and it is for me to say what becomes of it."
 ck3xbl_siege.0010.a:0 "Let the men take what they want."
 ck3xbl_siege.0010.b:0 "Let the townsfolk buy their safety."
 ck3xbl_siege.0010.c:0 "Spare the town. We came for the walls, not the people."
 ck3xbl_storming_party:0 "Storming Party Inside"
 ck3xbl_storming_party_desc:0 "Your men are on the walls: what is left of the defence is about to collapse."
 ck3xbl_sea_battle_decision:0 "Attack the Enemy Fleet in Bannerlord"
 ck3xbl_sea_battle_decision_desc:0 "Enemy sails are close. Bring the ships alongside and board them: the battle is fought ship against ship in Bannerlord."
 ck3xbl_sea_battle_decision_tooltip:0 "Attack an enemy fleet nearby in Bannerlord"
 ck3xbl_sea_battle_decision_effect_tt:0 "The enemy may slip away first: the better its commander's martial against yours, the likelier. Caught, it fights at sea in Bannerlord, and half the men who flee the losing ships drown."
 ck3xbl_sea.0002.t:0 "Battle at Sea"
 ck3xbl_sea.0002.desc:0 "Grappling hooks fly, the decks are crowded with men. The battle is fought in Bannerlord, and its outcome will be known here once it is over."
 ck3xbl_sea.0002.a:0 "The battle is over..."
 ck3xbl_sea.0002.b:0 "Call it off: the fleets part"
 ck3xbl_sea.0010.t:0 "Sails on the Horizon"
 ck3xbl_sea.0010.desc:0 "The lookout calls out: the ships of [ck3xbl_enemy_leader.Char.GetShortUIName] are in sight. The wind is with us, if we want them."
 ck3xbl_sea.0010.a:0 "Make for them!"
 ck3xbl_sea.0010.b:0 "Hold our course."
 ck3xbl_sea.0011.t:0 "Enemy Sails Bear Down"
 ck3xbl_sea.0011.desc:0 "The ships of [ck3xbl_enemy_leader.Char.GetShortUIName] have turned towards us and are closing fast."
 ck3xbl_sea.0011.a:0 "Clear the decks for battle!"
 ck3xbl_sea.0011.b:0 "Crowd on sail and run."
 ck3xbl_sea.0011.b.tt:0 "Your commander's martial against theirs decides whether you slip away; caught, you fight all the same."
 ck3xbl_sea.escaped:0 "They Slipped Away"
 ck3xbl_sea.escaped.desc:0 "The enemy fleet outran us and is gone."
 ck3xbl_sea.slipped:0 "We Got Away"
 ck3xbl_sea.slipped.desc:0 "The enemy ships fall behind: we are clear of them."
 ck3xbl_sea.caught:0 "They Caught Us"
 ck3xbl_sea.caught.desc:0 "There is no outrunning them: we have to fight."
 ck3xbl_sea.won:0 "Victory at Sea!"
 ck3xbl_sea.won.desc:0 "The enemy ships are taken or sunk."
 ck3xbl_sea.lost:0 "Defeat at Sea"
 ck3xbl_sea.lost.desc:0 "Our ships are beaten, and many of the men who jumped overboard never reached the shore."
